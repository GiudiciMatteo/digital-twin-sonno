# =============================================================
#  NODO RADAR - LETTURA VERSIONE MR60BHA2
#
#  Invia UNA SOLA query TinyFrame 0xFFFF:
#
#     01 80 00 00 00 FF FF 7E
#
#  NON contiene:
#  - comando 0x3000
#  - bootloader
#  - XMODEM
#  - aggiornamento firmware
# =============================================================

substitutions:
  name: "nodo-radar"
  friendly_name: "Nodo radar versione"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: "2024.6.0"

  # Aspettiamo 10 secondi dall'avvio, poi inviamo UNA SOLA VOLTA
  # la query versione al MR60BHA2.
  on_boot:
    priority: -100
    then:
      - delay: 10s
      - lambda: |-
          static const uint8_t VERSION_QUERY[] = {
            0x01, 0x80, 0x00, 0x00,
            0x00, 0xFF, 0xFF, 0x7E
          };

          ESP_LOGW("radar_version", "Invio query versione MR60BHA2: 01 80 00 00 00 FF FF 7E");

          id(uart_bus).write_array(
            VERSION_QUERY,
            sizeof(VERSION_QUERY)
          );

          ESP_LOGW("radar_version", "Query versione inviata. Nessun altro comando verra' trasmesso.");


# =============================================================
# ESP32-C6
# =============================================================

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf


# =============================================================
# LOGGER
# =============================================================

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG


# =============================================================
# OTA
# =============================================================

ota:
  - platform: esphome
    password: !secret ota_password


# =============================================================
# WIFI
# =============================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "nodo-radar-fallback"
    password: !secret ap_password

captive_portal:


# =============================================================
# MQTT
# =============================================================

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: sonno/nodo_radar
  discovery: false


# =============================================================
# UART MR60BHA2
# =============================================================

uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: 17
  tx_pin: 16
  parity: NONE
  stop_bits: 1

  # Osserviamo sia RX sia TX così nel log vediamo:
  # >>> query inviata
  # <<< risposta radar
  debug:
    direction: BOTH
    dummy_receiver: false

    after:
      timeout: 100ms

    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ' ');


# =============================================================
# COMPONENTE NATIVO MR60BHA2
# =============================================================

seeed_mr60bha2:
  id: my_seeed_mr60bha2
  uart_id: uart_bus


# =============================================================
# SENSORI
# =============================================================

sensor:

  - platform: seeed_mr60bha2

    breath_rate:
      name: "Frequenza respiratoria"
      id: resp_rate
      accuracy_decimals: 2
      filters:
        - throttle: 2s

    heart_rate:
      name: "Frequenza cardiaca"
      id: heart_rate
      accuracy_decimals: 2
      filters:
        - throttle: 2s

    distance:
      name: "Distanza bersaglio"
      id: distanza
      accuracy_decimals: 3
      filters:
        - throttle: 2s

    num_targets:
      name: "Numero bersagli"
      id: n_target
      filters:
        - throttle: 2s


  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s


  - platform: uptime
    name: "Uptime"
    update_interval: 60s


# =============================================================
# PRESENZA
# =============================================================

binary_sensor:

  - platform: seeed_mr60bha2

    has_target:
      name: "Presenza rilevata"
      id: presenza

      filters:
        - delayed_on_off: 2s


# =============================================================
# I2C
# =============================================================

i2c:
  - id: bus_a
    sda: GPIO22
    scl: GPIO23
    scan: true


# =============================================================
# DIAGNOSTICA
# =============================================================

text_sensor:

  - platform: version
    name: "Versione ESPHome"

  - platform: wifi_info
    ip_address:
      name: "Indirizzo IP"


# =============================================================
# TEMPO UTC
# =============================================================

time:

  - platform: sntp
    id: ora
    timezone: UTC

    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org