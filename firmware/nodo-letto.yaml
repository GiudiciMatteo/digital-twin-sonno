# =============================================================
#  NODO 2 — Sensore ambientale al letto  (XIAO ESP32C6 + BME280)
#  Progetto: Digital Twin del sonno
#  Pubblica via MQTT (nessuna dipendenza da Home Assistant)
# =============================================================

esphome:
  name: nodo-letto
  friendly_name: Nodo ambientale letto

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

# ---------- Rete ----------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # IP fisso consigliato: rende il nodo sempre raggiungibile
  # manual_ip:
  #   static_ip: 192.168.x.x
  #   gateway: 192.168.x.x
  #   subnet: 255.255.255.0
  ap:                      # rete di emergenza se il WiFi non si connette
    ssid: "nodo-letto-fallback"
    password: !secret ap_password

captive_portal:
logger:                    # log via USB seriale
ota:
  - platform: esphome
    password: !secret ota_password

# ---------- MQTT verso il BMAX ----------
mqtt:
  broker: !secret mqtt_broker        # es. 192.168.x.x (il BMAX)
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: sonno/nodo_letto
  discovery: false                   # nessuna discovery HA: dati indipendenti

# ---------- Bus I2C ----------
# XIAO ESP32C6:  D4 = GPIO22 (SDA)   |   D5 = GPIO23 (SCL)
i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true                         # elenca gli indirizzi trovati nel log
  id: bus_a
  frequency: 100kHz

# ---------- Sensori ----------
sensor:
  - platform: bme280_i2c
    address: 0x76                    # se non risponde, provare 0x77
    i2c_id: bus_a
    update_interval: 10s             # 10s: utile per le prove a gradino del modello termico
    temperature:
      name: "Temperatura letto"
      id: temp_letto
      accuracy_decimals: 2
      filters:
        - offset: 0.0                # eventuale correzione dopo confronto con riferimento
    humidity:
      name: "Umidita letto"
      id: umid_letto
      accuracy_decimals: 1
    pressure:
      name: "Pressione"
      id: press_letto
      accuracy_decimals: 1
    iir_filter: 16x                  # smorza il rumore di misura

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# ---------- Diagnostica ----------
text_sensor:
  - platform: version
    name: "Versione ESPHome"
  - platform: wifi_info
    ip_address:
      name: "Indirizzo IP"

# ---------- Sincronizzazione oraria (fondamentale: tutto in UTC) ----------
time:
  - platform: sntp
    id: ora
    timezone: UTC
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

status_led:
  pin:
    number: GPIO15
    inverted: true
