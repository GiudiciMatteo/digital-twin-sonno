# =============================================================
#  NODO 1 — Radar mmWave 60 GHz (Seeed MR60BHA2 + XIAO ESP32C6)
#  DIAGNOSTICA UART RX
#
#  Scopo:
#  - mantenere il normale funzionamento del radar
#  - osservare i frame UART provenienti dal MR60BHA2
#  - NON inviare comandi diagnostici al radar
# =============================================================

substitutions:
  name: "nodo-radar"
  friendly_name: "Nodo radar letto"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  platformio_options:
    board_upload.maximum_size: 4194304
  min_version: "2024.6.0"


# =============================================================
# ESP32-C6
# =============================================================

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf


# =============================================================
# LOG
#
# DEBUG TEMPORANEO per vedere uart_debug.
# USB_SERIAL_JTAG evita di usare la UART hardware del radar.
# =============================================================

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG


# =============================================================
# OTA
# =============================================================

ota:
  - platform: esphome
    password: !secret ota_password


# =============================================================
# WIFI
# =============================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "nodo-radar-fallback"
    password: !secret ap_password

captive_portal:


# =============================================================
# MQTT
# =============================================================

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password

  topic_prefix: sonno/nodo_radar
  discovery: false


# =============================================================
# UART MR60BHA2
#
# IMPORTANTE:
# Il blocco debug osserva esclusivamente RX.
# Non viene inviato alcun comando diagnostico al radar.
# =============================================================

uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: 17
  tx_pin: 16
  parity: NONE
  stop_bits: 1

  debug:
    direction: RX
    dummy_receiver: false

    after:
      timeout: 100ms

    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ' ');


# =============================================================
# COMPONENTE NATIVO MR60BHA2
# =============================================================

seeed_mr60bha2:
  id: my_seeed_mr60bha2
  uart_id: uart_bus


# =============================================================
# SENSORI RADAR
#
# Manteniamo throttle 2s perché nel test precedente ha eliminato
# i warning "took a long time for an operation".
# =============================================================

sensor:

  # -----------------------------------------------------------
  # MR60BHA2
  # -----------------------------------------------------------

  - platform: seeed_mr60bha2

    breath_rate:
      name: "Frequenza respiratoria"
      id: resp_rate
      accuracy_decimals: 2
      filters:
        - throttle: 2s

    heart_rate:
      name: "Frequenza cardiaca"
      id: heart_rate
      accuracy_decimals: 2
      filters:
        - throttle: 2s

    distance:
      name: "Distanza bersaglio"
      id: distanza
      accuracy_decimals: 3
      filters:
        - throttle: 2s

    num_targets:
      name: "Numero bersagli"
      id: n_target
      filters:
        - throttle: 2s


  # -----------------------------------------------------------
  # WiFi
  # -----------------------------------------------------------

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s


  # -----------------------------------------------------------
  # Uptime
  # -----------------------------------------------------------

  - platform: uptime
    name: "Uptime"
    update_interval: 60s


# =============================================================
# PRESENZA
# =============================================================

binary_sensor:

  - platform: seeed_mr60bha2

    has_target:
      name: "Presenza rilevata"
      id: presenza

      filters:
        - delayed_on_off: 2s


# =============================================================
# I2C
# =============================================================

i2c:

  - id: bus_a
    sda: GPIO22
    scl: GPIO23
    scan: true


# BH1750 lasciato disabilitato come nel file originale.

# sensor:
#   - platform: bh1750
#     name: "Luce ambientale"
#     i2c_id: bus_a
#     address: 0x23
#     update_interval: 10s


# =============================================================
# DIAGNOSTICA
# =============================================================

text_sensor:

  - platform: version
    name: "Versione ESPHome"

  - platform: wifi_info

    ip_address:
      name: "Indirizzo IP"


# =============================================================
# TEMPO UTC
# =============================================================

time:

  - platform: sntp
    id: ora
    timezone: UTC

    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org